[project]
name = "yupi"
version = "1.1.0-beta0"
description = "A package for tracking and analysing objects trajectories"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gustavo Viera-López", email = "gvieralopez@gmail.com" },
    { name = "Alfredo Reyes", email = "areyes@fisica.uh.cu" },
    { name = "Jorge Morgado", email = "jorge.morgadov@gmail.com" },
    { name = "Ernesto Altshuler", email = "ealtshuler@fisica.uh.cu" },
]
license = { text = "MIT" }
keywords = ["trajectory", "analysis", "tracking"]

dependencies = [
    "opencv-python >=4.4.0",
    "numpy >=1.16.5",
    "nudged >=0.3.1",
    "matplotlib >=3.2.0",
]

[project.urls]
Repository = "https://github.com/yupidevs/yupi"
Documentation = "https://yupi.readthedocs.io"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-env>=1.8",
    "ruff>=0.17",
    "ebump>=0.2.2",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".cookie-pyrate", "docs"]  # docs/: the legacy Sphinx site, until it moves to the template docs

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: Check variables shadowing
    "ARG",    # flake8-unusedarguments
    "B",      # flake8-bugbear: Finds likely bugs and design problems
    "C901",   # Mccabe complexity checker
    "ERA",    # Erradicate
    "E4",     # Pycodestyle: Line length, indentation, etc.
    "E7",     # Pycodestyle: Miscellaneous checks
    "E9",     # Pycodestyle: Syntax errors
    "F",      # Pyflakes: Unused imports, undefined variables, etc.
    "FIX",    # Avoid lines containing TODO tags
    "G",      # flake8-logging-format: Ensure logging messages follow best practices.
    "I",      # Isort: Import sorting
    "LOG",    # flake8-logging: Use the logging module correctly
    "N",      # pep8-naming: Enforce naming conventions
    "PGH004", # Enforce specify the rule to avoid on noqa tags
    "PL",     # Pylint
    "PTH",    # flake8-use-pathlib: Enforces pathlib usage
    "RUF",    # Ruff-specific rules: Mostly for handling noqa tags and general stuff
    "S",      # flake8-bandit: Identifies common security issues in code
    "SIM",    # flake8-simplify
    "T20",    # flake8-print: Avoids print in the code
    "UP",     # Pyupgrade
    "W",      # Pycodestyle warnings
]
# NEEDS ATTENTION: the rules below are disabled only to move the project onto the cookie-pyrate
# scaffolding without touching the library's source code or public API. Each one has open findings
# in src/ that need a code change (some of them breaking) and should be re-enabled once fixed.
ignore = [
    "C901",    # Function too complex (one function)
    "ERA001",  # Commented-out code
    "FIX002",  # Lines containing TODO
    "LOG015",  # Calls on the root logger (a module logger changes the logger name users filter on)
    "N803",    # Upper-case argument names such as T, N, M (public API)
    "N806",    # Upper-case local variables
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments (public API, e.g. Trajectory.__init__)
    "PLR0917", # Too many positional arguments (public API)
    "PLR1722", # exit() instead of sys.exit()
    "PLR2004", # Magic values in comparisons
    "RUF005",  # Collection literal concatenation
    "RUF012",  # Mutable class attributes without ClassVar
    "S101",    # assert in library code (raising other exceptions changes behaviour)
    "SIM118",  # `key in dict.keys()`
    "UP042",   # UnitEnum(str, Enum) -> StrEnum (changes str() and format() output)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
# NEEDS ATTENTION: RUF043 (regex metacharacters in pytest.raises match) is disabled in the tests
# only to keep this migration free of code changes.
"tests/**" = ["ARG", "S101", "PLR2004", "PLR0913", "RUF043"]
"scripts/**" = ["T20", "S603"]  # Allow print statements and subprocess calls on the scripts

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true


[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
extra_checks = true
# NEEDS ATTENTION: the error codes below are disabled only to move the project onto the
# cookie-pyrate scaffolding without touching the library's source code. They have open findings
# in src/ (mostly numpy and OpenCV return types) and should be re-enabled once fixed.
disable_error_code = [
    "arg-type",
    "assignment",
    "call-overload",
    "import-untyped",
    "no-any-return",
    "unused-ignore",
]


[tool.pytest.ini_options]
minversion = "6.0"
# NEEDS ATTENTION: the template's gate is 80%; yupi's own gate (75%) is kept until the tracking
# and plotting code have tests.
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=75"
python_files = "tests.py test_*.py *_test.py"
pythonpath = "./src"
env_files = [".env.test"]


[tool.ebump.patterns]
"src/yupi/__init__.py" = ['^__version__ = "{version}"$']
"docs/source/conf.py" = ['^release = "{version}"$']
