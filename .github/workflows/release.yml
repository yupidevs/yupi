name: Release

on:
  workflow_run:
    workflows: ["QA"]
    branches: [main]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: gvieralopez/cookie-pyrate/.github/workflows/reusable-release.yml@v1.0.3
    permissions:
      contents: write
    with:
      cookie-pyrate-ref: v1.0.3
      create-github-release: true
      attach-distribution: false
      prepare-next-version: true
    # Passes RELEASE_SSH_KEY (created by `make repo`; lets the version bumps land on a
    # protected main) and any secret named in secret-env.
    secrets: inherit

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yupi/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: gvieralopez/cookie-pyrate/.github/actions/publish-to-pypi@v1.0.3
        with:
          sha: ${{ needs.release.outputs.sha }}
